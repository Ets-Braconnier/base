<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Factures · Braconnier</title><style>
:root{--brand:#f47b00;--ink:#222a31;--muted:#667085;--line:#e1e5e9;--navy:#29343d;--soft:#f3f5f6;--green:#1f7a4d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--soft);color:var(--ink)}.wrap{max-width:1250px;margin:auto;padding:18px}.head{background:var(--navy);color:#fff;border-radius:12px;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:12px}.brand img{width:145px;height:44px;object-fit:contain;background:#fff;border-radius:8px;padding:5px}.head a{color:#fff;text-decoration:none;border:1px solid #5c6670;border-radius:8px;padding:9px 12px;font-size:12px}.hero{margin:14px 0;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.hero h1{margin:0 0 5px;font-size:25px}.hero p{margin:0;color:var(--muted);font-size:12px}.storage{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 14px;min-width:300px}.bar{height:8px;background:#edf0f2;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;background:var(--green);width:0}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}.search{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px}input,button{height:40px;border:1px solid #cfd5da;border-radius:8px;padding:0 11px}button{border:0;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}.upload{background:var(--brand)}.results{display:grid;gap:8px}.row{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:1.1fr 1.6fr .8fr .8fr auto;gap:10px;align-items:center}.row small{display:block;color:var(--muted);margin-top:3px}.actions{display:flex;gap:6px}.actions button{height:34px;font-size:11px}.empty{text-align:center;padding:28px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:15px}.modal.show{display:grid}.card{width:min(620px,100%);background:#fff;border-radius:14px;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid .wide{grid-column:1/-1}.card label{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}.card input{width:100%}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.status{font-size:11px;color:var(--muted);margin-top:8px}@media(max-width:800px){.hero{grid-template-columns:1fr}.storage{min-width:0}.search,.row{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.grid .wide{grid-column:auto}}</style></head><body><div class="wrap">
<div class="head"><div class="brand"><img src="logo-braconnier.png" alt="Braconnier"><b>Archives factures</b></div><a href="index.html">← Portail</a></div>
<div class="hero"><div><h1>Factures Braconnier</h1><p>Recherche par numéro de facture, client, numéro client ou période.</p></div><div class="storage"><b>Stockage R2 total</b><span id="storageText" style="float:right;font-size:11px">Chargement…</span><div class="bar"><div id="storageFill" class="fill"></div></div><div id="storageDetail" class="status">Documents fournisseurs + factures Braconnier + factures Outilsud</div></div></div>
<div class="panel"><div class="search"><input id="q" placeholder="N° facture, client, n° client…"><input id="from" type="date" title="Du"><input id="to" type="date" title="Au"><input id="amount" inputmode="decimal" placeholder="Montant"><button id="searchBtn">Rechercher</button></div><div style="margin-top:10px;display:flex;justify-content:space-between;gap:10px;align-items:center"><span id="count" class="status">0 facture</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="importAllBtn">Import complet</button><button id="exportAllBtn">Export complet</button><button class="upload" id="addBtn">+ Ajouter des factures</button></div></div></div>
<div class="panel"><div id="results" class="results"><div class="empty">Utilisez la recherche ou ajoutez des factures.</div></div></div></div>
<div class="modal" id="modal"><div class="card"><h2 style="margin-top:0">Ajouter une facture</h2><div class="grid"><div><label>N° facture</label><input id="invoiceNo" placeholder="Auto depuis le fichier, ex. VK1234.pdf"></div><div><label>Date</label><input id="invoiceDate" type="date"></div><div><label>N° client</label><input id="clientNo"></div><div><label>Nom client</label><input id="clientName"></div><div><label>Montant</label><input id="invoiceAmount" inputmode="decimal"></div><div><label>Fichier PDF / image</label><input id="invoiceFile" type="file" accept="application/pdf,image/*"></div><div class="wide"><label>Note</label><input id="invoiceNote" placeholder="Facultatif"></div></div><div id="uploadStatus" class="status"></div><div class="modal-actions"><button id="cancelBtn" style="background:#777">Annuler</button><button id="uploadBtn" class="upload">Importer</button></div></div></div>
<script>
const ENSEIGNE='braconnier',AUTH='https://braconnier-auth.sebastien-025.workers.dev',TOKEN_KEY='braconnier_portal_token_v3';const $=id=>document.getElementById(id);function token(){return sessionStorage.getItem(TOKEN_KEY)||''}async function api(path,opt={}){const h=new Headers(opt.headers||{});h.set('Authorization','Bearer '+token());h.set('X-Enseigne',ENSEIGNE);const r=await fetch(AUTH+path,{...opt,headers:h});if(r.status===401){location='index.html';throw Error('Session expirée')}const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Service factures non disponible');return j}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function storage(){try{const j=await api('/files/storage');const pct=Math.min(100,Number(j.percent||((j.usedGB||0)/(j.limitGB||9.5)*100)));$('storageText').textContent=Number(j.usedGB||0).toFixed(2).replace('.',',')+' Go / '+Number(j.limitGB||9.5).toFixed(1).replace('.',',')+' Go';$('storageFill').style.width=pct+'%';if(j.breakdown){$('storageDetail').textContent='Fournisseurs : '+fmtGB(j.breakdown.fournisseurs)+' · Braconnier : '+fmtGB(j.breakdown.factures_braconnier)+' · Outilsud : '+fmtGB(j.breakdown.factures_outilsud)}}catch{$('storageText').textContent='Indisponible'}}function fmtGB(v){return Number(v||0).toFixed(2).replace('.',',')+' Go'}async function search(){const p=new URLSearchParams();[['q','q'],['from','from'],['to','to'],['amount','amount']].forEach(([id,k])=>{if($(id).value)p.set(k,$(id).value)});$('results').innerHTML='<div class="empty">Recherche…</div>';try{const j=await api('/factures?'+p);const a=j.factures||[];$('count').textContent=a.length+' facture'+(a.length>1?'s':'');$('results').innerHTML=a.length?a.map(x=>`<div class="row"><div><b>${esc(x.numero_facture)}</b><small>${esc(x.date_facture||'')}</small></div><div><b>${esc(x.nom_client||'Client non renseigné')}</b><small>${esc(x.numero_client||'')}</small></div><div>${esc(x.montant||'')} ${x.montant?'€':''}</div><div><small>${esc(x.nom_fichier||'')}</small></div><div class="actions"><button onclick="openInvoice(${Number(x.id)})">Ouvrir</button><button onclick="deleteInvoice(${Number(x.id)})" style="background:#a33b3b">Suppr.</button></div></div>`).join(''):'<div class="empty">Aucune facture trouvée.</div>'}catch(e){$('results').innerHTML='<div class="empty">'+esc(e.message)+'<br><small>Les routes /factures doivent être ajoutées au Worker Cloudflare.</small></div>'}}async function openInvoice(id){try{const r=await fetch(AUTH+'/factures/'+id+'/fichier',{headers:{'Authorization':'Bearer '+token(),'X-Enseigne':ENSEIGNE}});if(!r.ok){const j=await r.json().catch(()=>({}));throw Error(j.error||'Ouverture impossible')}const b=await r.blob();const u=URL.createObjectURL(b);window.open(u,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(u),60000)}catch(e){alert(e.message)}}async function deleteInvoice(id){if(!confirm('Supprimer cette facture ?'))return;try{await api('/factures/'+id,{method:'DELETE'});search();storage()}catch(e){alert(e.message)}}$('searchBtn').onclick=search;$('importAllBtn').onclick=()=>alert('Import complet prévu. Il acceptera un lot de factures et, plus tard, un index Kluwer/Mercator pour compléter automatiquement dates et clients.');$('exportAllBtn').onclick=()=>alert('Export complet prévu : toutes les factures de cette enseigne + leur index.');$('q').onkeydown=e=>{if(e.key==='Enter')search()};$('addBtn').onclick=()=>{$('modal').classList.add('show')};$('cancelBtn').onclick=()=>{$('modal').classList.remove('show')};$('uploadBtn').onclick=async()=>{const f=$('invoiceFile').files[0];if(!f){$('uploadStatus').textContent='Fichier obligatoire.';return}if(!$('invoiceNo').value){$('invoiceNo').value=f.name.replace(/\.[^.]+$/,'')}const fd=new FormData();[['numero_facture','invoiceNo'],['date_facture','invoiceDate'],['numero_client','clientNo'],['nom_client','clientName'],['montant','invoiceAmount'],['note','invoiceNote']].forEach(([k,id])=>fd.append(k,$(id).value));fd.append('file',f);$('uploadStatus').textContent='Import en cours…';try{await api('/factures/upload',{method:'POST',body:fd});$('modal').classList.remove('show');$('invoiceFile').value='';$('uploadStatus').textContent='';search();storage()}catch(e){$('uploadStatus').textContent=e.message}};(async()=>{if(!token()){location='index.html';return}try{await api('/auth/check')}catch{return}storage();search()})();
</script></body></html>
