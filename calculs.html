<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculs — Ets Braconnier</title><script src="portal-session.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f6;color:#29343d;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1600px;margin:auto;padding:18px}header{background:#29343d;color:white;border-radius:14px;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.logo{background:#f47b00;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:24px;font-weight:bold}h1{margin:0;font-size:23px}.sub{font-size:12px;margin-top:5px;color:#d5dde1}nav{display:flex;gap:8px;flex-wrap:wrap}nav a,nav button{background:#f47b00;color:white;border:0;border-radius:7px;padding:10px 12px;font:700 12px Arial;text-decoration:none;cursor:pointer}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;margin-top:18px}aside,.viewer{background:white;border:1px solid #dde2e6;border-radius:12px;padding:15px}aside{max-height:calc(100vh - 150px);overflow:auto}input{width:100%;padding:11px;border:1px solid #ccd3d8;border-radius:7px;font:14px Arial}h2{font-size:13px;margin:20px 0 8px;color:#68727c}.choice{display:block;width:100%;text-align:left;padding:11px;margin:3px 0;border:0;border-radius:7px;background:transparent;color:#29343d;cursor:pointer;font:14px Arial}.choice:hover{background:#fff4e8}.choice[aria-pressed=true]{background:#29343d;color:white}.viewer-head{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:12px}.viewer-head strong{font-size:18px}.viewer-head a{font-size:12px;color:#2d6b5e}iframe{display:block;width:100%;height:calc(100vh - 220px);min-height:620px;border:0;border-top:1px solid #eee}#status{padding:12px;color:#68727c}[hidden]{display:none!important}:focus-visible{outline:3px solid #f47b00;outline-offset:2px}@media(max-width:750px){.wrap{padding:10px}.layout{grid-template-columns:1fr}aside{max-height:260px}iframe{height:75vh;min-height:550px}.viewer-head{flex-wrap:wrap}}
</style></head><body><div class="wrap"><header><div class="brand"><div class="logo">B</div><div><h1>Calculs</h1><div class="sub">Ets Braconnier · 31 calculateurs</div></div></div><nav aria-label="Navigation principale"><a href="index.html">Accueil</a><a href="netstore.html">NetStore</a><a href="fournisseurs.html">Base fournisseurs</a><button type="button" onclick="portalLogout()">Déconnexion</button></nav></header>
<p id="status" role="status">Vérification de la session…</p><main class="layout" id="workspace" hidden><aside aria-label="Choisir un calculateur"><input id="search" type="search" aria-label="Rechercher un calculateur" placeholder="Rechercher un calculateur…"><div id="choices"></div></aside><section class="viewer"><div class="viewer-head"><strong id="currentTitle"></strong><a id="openTool" target="_blank" rel="noopener">Ouvrir en plein onglet ↗</a></div><div id="frames"></div></section></main></div>
<script>
const tools=[{"file":"calculateurs/charges-admissibles/ch-ad-hourdis.html","label":"Charge Admissible Hourdis","group":"Charges admissibles"},{"file":"calculateurs/charges-admissibles/ch-ad-linteaux.html","label":"Charge admissible Linteaux","group":"Charges admissibles"},{"file":"calculateurs/charges-admissibles/ch-ad-plancher-bois.html","label":"Charge Admissible Plancher Bois","group":"Charges admissibles"},{"file":"calculateurs/charges-admissibles/ch-ad-poutrains-entrevous.html","label":"Charge Admissible Poutrains & Entrevous","group":"Charges admissibles"},{"file":"calculateurs/charges-admissibles/ch-ad-heb.html","label":"Charge admissible Poutrelles HEB","group":"Charges admissibles"},{"file":"calculateurs/charges-admissibles/ch-ad-pre-linteaux.html","label":"Charge admissible Prélinteaux","group":"Charges admissibles"},{"file":"calculateurs/poids/poids-agreats.html","label":"poids des Agrégats","group":"Poids"},{"file":"calculateurs/poids/poids-blocs.html","label":"Poids des blocs","group":"Poids"},{"file":"calculateurs/poids/poids-bordures-beton.html","label":"Poids des bordures Béton","group":"Poids"},{"file":"calculateurs/poids/poids-plaques.html","label":"Poids des plaques","group":"Poids"},{"file":"calculateurs/poids/poids-linteaux-pre-linteaux.html","label":"Poids Linteaux & Prélinteaux","group":"Poids"},{"file":"calculateurs/blocs.html","label":"Blocs & Liants","group":"Quantités et dimensions"},{"file":"calculateurs/blocs-cellulaires.html","label":"Blocs cellulaires","group":"Quantités et dimensions"},{"file":"calculateurs/brique.html","label":"Briques & Liants","group":"Quantités et dimensions"},{"file":"calculateurs/carrelage.html","label":"Carrelages & Joints","group":"Quantités et dimensions"},{"file":"calculateurs/chape.html","label":"Chape","group":"Quantités et dimensions"},{"file":"calculateurs/cubage-beton.html","label":"Cubage du béton","group":"Quantités et dimensions"},{"file":"calculateurs/egaline.html","label":"Égaline","group":"Quantités et dimensions"},{"file":"calculateurs/escalier.html","label":"Escaliers","group":"Quantités et dimensions"},{"file":"calculateurs/facade-cimentee.html","label":"Façades Cimentées","group":"Quantités et dimensions"},{"file":"calculateurs/facade-isolante.html","label":"Façades isolantes","group":"Quantités et dimensions"},{"file":"calculateurs/calculateur-foisonnement.html","label":"foisonnement","group":"Quantités et dimensions"},{"file":"calculateurs/generateur_plan_encadrements_fenetres_portes_v8.html","label":"Générateur de plans – Encadrements de fenêtres & portes","group":"Quantités et dimensions"},{"file":"calculateurs/hourdis.html","label":"Hourdis","group":"Quantités et dimensions"},{"file":"calculateurs/isolant.html","label":"Isolants","group":"Quantités et dimensions"},{"file":"calculateurs/mortex.html","label":"Mortex","group":"Quantités et dimensions"},{"file":"calculateurs/paves_autobloquants.html","label":"pavés","group":"Quantités et dimensions"},{"file":"calculateurs/plots.html","label":"Plots pour Terrasse","group":"Quantités et dimensions"},{"file":"calculateurs/stepocs.html","label":"Stepoc","group":"Quantités et dimensions"},{"file":"calculateurs/cloisons.html","label":"Structures & Habillages","group":"Quantités et dimensions"},{"file":"calculateurs/tapis-de-pierre.html","label":"Tapis de pierre","group":"Quantités et dimensions"}];
const choices=document.getElementById('choices'),frames=document.getElementById('frames');
let selected=null;
function selectTool(tool){
 selected=tool;
 for(const frame of frames.children)frame.hidden=frame.dataset.file!==tool.file;
 let frame=Array.from(frames.children).find(f=>f.dataset.file===tool.file);
 if(!frame){frame=document.createElement('iframe');frame.src=tool.file;frame.title=tool.label;frame.dataset.file=tool.file;frames.append(frame)}
 document.getElementById('currentTitle').textContent=tool.label;
 document.getElementById('openTool').href=tool.file;
 for(const button of choices.querySelectorAll('button'))button.setAttribute('aria-pressed',String(button.dataset.file===tool.file));
}
function renderChoices(){
 const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 const q=normalize(document.getElementById('search').value);choices.replaceChildren();
 for(const group of ['Quantités et dimensions','Poids','Charges admissibles']){
 const list=tools.filter(t=>t.group===group&&normalize(t.label+' '+group).includes(q));if(!list.length)continue;
 const heading=document.createElement('h2');heading.textContent=group;choices.append(heading);
 for(const tool of list){const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=tool.label;b.dataset.file=tool.file;b.setAttribute('aria-pressed',String(selected===tool));b.onclick=()=>selectTool(tool);choices.append(b)}
 }
 if(!choices.children.length)choices.textContent='Aucun calculateur trouvé.';
}
document.getElementById('search').addEventListener('input',renderChoices);
(async()=>{const token=sessionStorage.getItem('braconnier_portal_token_v3');if(!token){location.replace('index.html');return}try{const r=await fetch('https://braconnier-auth.sebastien-025.workers.dev/auth/check',{headers:{Authorization:'Bearer '+token}});if(!r.ok){portalLogout();return}document.getElementById('status').hidden=true;document.getElementById('workspace').hidden=false;renderChoices();selectTool(tools.find(t=>t.file==='calculateurs/cubage-beton.html')||tools[0])}catch{document.getElementById('status').textContent='Connexion indisponible. Rechargez la page pour réessayer.'}})();
</script></body></html>
