(() => {
 const tokenKey="braconnier_portal_token_v3",logoutKey="braconnier_portal_logout";
 const home=new URL("index.html",window.location.href).href;
 window.portalLogout=function(){
  sessionStorage.removeItem(tokenKey);
  try{localStorage.setItem(logoutKey,Date.now()+":"+Math.random())}catch{}
  window.location.replace(home);
 };
 window.addEventListener("storage",event=>{
  if(event.key===logoutKey){sessionStorage.removeItem(tokenKey);window.location.replace(home)}
 });
 window.addEventListener("pageshow",event=>{
  if(event.persisted&&!sessionStorage.getItem(tokenKey))window.location.replace(home);
 });
})();

</script>

<script>
const tools=[{"file":"calculateurs/charges-admissibles/ch-ad-hourdis.html","label":"Charge Admissible Hourdis","group":"Charges admissibles"},{"file":"calculateurs/charges-admissibles/ch-ad-linteaux.html","label":"Charge admissible Linteaux","group":"Charges admissibles"},{"file":"calculateurs/charges-admissibles/ch-ad-plancher-bois.html","label":"Charge Admissible Plancher Bois","group":"Charges admissibles"},{"file":"calculateurs/charges-admissibles/ch-ad-poutrains-entrevous.html","label":"Charge Admissible Poutrains & Entrevous","group":"Charges admissibles"},{"file":"calculateurs/charges-admissibles/ch-ad-heb.html","label":"Charge admissible Poutrelles HEB","group":"Charges admissibles"},{"file":"calculateurs/charges-admissibles/ch-ad-pre-linteaux.html","label":"Charge admissible Prélinteaux","group":"Charges admissibles"},{"file":"calculateurs/poids/poids-agreats.html","label":"poids des Agrégats","group":"Poids des matériaux"},{"file":"calculateurs/poids/poids-blocs.html","label":"Poids des blocs","group":"Poids des matériaux"},{"file":"calculateurs/poids/poids-bordures-beton.html","label":"Poids des bordures Béton","group":"Poids des matériaux"},{"file":"calculateurs/poids/poids-plaques.html","label":"Poids des plaques","group":"Poids des matériaux"},{"file":"calculateurs/poids/poids-linteaux-pre-linteaux.html","label":"Poids Linteaux & Prélinteaux","group":"Poids des matériaux"},{"file":"calculateurs/blocs.html","label":"Blocs & Liants","group":"Quantités de matériaux"},{"file":"calculateurs/blocs-cellulaires.html","label":"Blocs cellulaires","group":"Quantités de matériaux"},{"file":"calculateurs/brique.html","label":"Briques & Liants","group":"Quantités de matériaux"},{"file":"calculateurs/carrelage.html","label":"Carrelages & Joints","group":"Quantités de matériaux"},{"file":"calculateurs/chape.html","label":"Chape","group":"Quantités de matériaux"},{"file":"calculateurs/cubage-beton.html","label":"Cubage du béton","group":"Quantités de matériaux"},{"file":"calculateurs/egaline.html","label":"Égaline","group":"Quantités de matériaux"},{"file":"calculateurs/escalier.html","label":"Escaliers","group":"Calculs techniques"},{"file":"calculateurs/facade-cimentee.html","label":"Façades Cimentées","group":"Quantités de matériaux"},{"file":"calculateurs/facade-isolante.html","label":"Façades isolantes","group":"Quantités de matériaux"},{"file":"calculateurs/calculateur-foisonnement.html","label":"foisonnement","group":"Calculs techniques"},{"file":"calculateurs/generateur_plan_encadrements_fenetres_portes_v8.html","label":"Générateur de plans – Encadrements de fenêtres & portes","group":"Calculs techniques"},{"file":"calculateurs/hourdis.html","label":"Hourdis","group":"Quantités de matériaux"},{"file":"calculateurs/isolant.html","label":"Isolants","group":"Quantités de matériaux"},{"file":"calculateurs/mortex.html","label":"Mortex","group":"Quantités de matériaux"},{"file":"calculateurs/paves_autobloquants.html","label":"pavés","group":"Quantités de matériaux"},{"file":"calculateurs/plots.html","label":"Plots pour Terrasse","group":"Quantités de matériaux"},{"file":"calculateurs/stepocs.html","label":"Stepoc","group":"Quantités de matériaux"},{"file":"calculateurs/cloisons.html","label":"Structures & Habillages","group":"Quantités de matériaux"},{"file":"calculateurs/tapis-de-pierre.html","label":"Tapis de pierre","group":"Quantités de matériaux"}];
const choices=document.getElementById('choices'),frames=document.getElementById('frames');
let selected=null;
function selectTool(tool){
 selected=tool;
 for(const frame of frames.children)frame.hidden=frame.dataset.file!==tool.file;
 let frame=Array.from(frames.children).find(f=>f.dataset.file===tool.file);
 if(!frame){frame=document.createElement('iframe');frame.src=tool.file;frame.title=tool.label;frame.dataset.file=tool.file;frames.append(frame)}
 document.getElementById('currentTitle').textContent=tool.label;
 document.getElementById('openTool').href=tool.file;
 for(const button of choices.querySelectorAll('button'))button.setAttribute('aria-pressed',String(button.dataset.file===tool.file));
}
function renderChoices(){
 const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 const q=normalize(document.getElementById('search').value);choices.replaceChildren();
 for(const group of ['Quantités de matériaux','Calculs techniques','Charges admissibles','Poids des matériaux']){
  const list=tools.filter(t=>t.group===group&&normalize(t.label+' '+group).includes(q));
  if(!list.length)continue;

  const wrapper=document.createElement('div');wrapper.className='group';
  const toggle=document.createElement('button');toggle.type='button';toggle.className='group-toggle';toggle.textContent=group;
  const content=document.createElement('div');content.className='group-content';
  const contentId='group-'+normalize(group).replace(/[^a-z0-9]+/g,'-');content.id=contentId;

  // Tous les volets sont fermés par défaut. Pendant une recherche, les groupes correspondants s'ouvrent automatiquement.
  const open=Boolean(q);toggle.setAttribute('aria-expanded',String(open));toggle.setAttribute('aria-controls',contentId);content.hidden=!open;
  toggle.onclick=()=>{const isOpen=toggle.getAttribute('aria-expanded')==='true';toggle.setAttribute('aria-expanded',String(!isOpen));content.hidden=isOpen};

  for(const tool of list){
   const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=tool.label;b.dataset.file=tool.file;
   b.setAttribute('aria-pressed',String(selected===tool));b.onclick=()=>selectTool(tool);content.append(b)
  }
  wrapper.append(toggle,content);choices.append(wrapper)
 }
 if(!choices.children.length)choices.textContent='Aucun calculateur trouvé.';
}
document.getElementById('search').addEventListener('input',renderChoices);
(async()=>{const token=sessionStorage.getItem('braconnier_portal_token_v3');if(!token){location.replace('index.html');return}try{const r=await fetch('https://braconnier-auth.sebastien-025.workers.dev/auth/check',{headers:{Authorization:'Bearer '+token}});if(!r.ok){portalLogout();return}document.getElementById('status').hidden=true;document.getElementById('workspace').hidden=false;renderChoices();selectTool(tools.find(t=>t.file==='calculateurs/cubage-beton.html')||tools[0])}catch{document.getElementById('status').textContent='Connexion indisponible. Rechargez la page pour réessayer.'}})();
</script></body></html>
